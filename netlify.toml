# Netlify reads the Node version from .nvmrc and pnpm from package.json "packageManager".
[build]
  command = "pnpm build"
  publish = "dist"

# Astro's hashed assets never change, so cache them for a year
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
